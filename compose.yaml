services:
  api:
    build: .
    env_file: .env
    environment:
      APP_DATA: /app/data
    volumes:
      - app_data:/app/data
    ports:
      - "127.0.0.1:8765:8765"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/health')"]
      interval: 20s
      timeout: 5s
      retries: 3
  worker:
    build: .
    command: ["python", "-m", "app.worker"]
    env_file: .env
    environment:
      APP_DATA: /app/data
    volumes:
      - app_data:/app/data
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
volumes:
  app_data:
