entrypoint:
  - bash ${TACC_WORKDIR}/probe.sh
environment:
  name: assignment3-sdk-v1
  channels:
    - nodefaults
  dependencies:
    - "{}"
job:
  name: clause-tacc-probe
  general:
    - partition=tacc
    - nodes=1
    - ntasks=1
    - cpus-per-task=2
    - gres=gpu:1
    - time=00:03:00
    - output=${TACC_SLURM_USERLOG}/clause-tacc-probe-%j.log
